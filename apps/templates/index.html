<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>택 검수 — 바코드 + OCR 대조</title>
<style>
  :root {
    --bg:#12141a; --panel:#1a1d26; --panel-2:#212533; --line:#2c3140;
    --fg:#e6e8ee; --muted:#8b93a7; --accent:#6ea8fe;
    --good:#4ade80; --warn:#fbbf24; --bad:#f87171;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg); line-height:1.5;
    font-family:"Pretendard","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  main { max-width:960px; margin:0 auto; padding:32px 20px 80px; }
  header { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
  h1 { font-size:20px; margin:0; letter-spacing:-0.01em; }
  #info { font-size:13px; color:var(--muted); font-family:ui-monospace,Consolas,monospace; }
  #info.bad { color:var(--warn); }

  .drop {
    border:1.5px dashed var(--line); border-radius:12px; background:var(--panel);
    padding:40px 20px; text-align:center; cursor:pointer; transition:border-color .15s,background .15s;
  }
  .drop:hover,.drop:focus-visible { border-color:var(--accent); outline:none; }
  .drop.over { border-color:var(--accent); background:var(--panel-2); }
  .drop-title { font-size:16px; font-weight:600; }
  .drop-sub { font-size:13px; color:var(--muted); margin-top:6px; }

  #queue { font-size:13px; color:var(--muted); margin:12px 2px 0; min-height:1.4em; }
  #results { margin-top:24px; display:flex; flex-direction:column; gap:14px; }

  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .card.ok   { border-left:4px solid var(--good); }
  .card.bad  { border-left:4px solid var(--bad); }
  .card.wait { border-left:4px solid var(--line); }

  .head { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); }
  .fname { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
  .badge { font-size:13px; font-weight:600; padding:3px 12px; border-radius:20px; white-space:nowrap; }
  .badge.ok   { background:rgba(74,222,128,.14); color:var(--good); }
  .badge.bad  { background:rgba(248,113,113,.14); color:var(--bad); }
  .badge.wait { background:var(--panel-2); color:var(--muted); }
  .badge.warn { background:rgba(251,191,36,.14); color:var(--warn); }

  .grid { display:grid; grid-template-columns:150px 1fr; gap:16px; padding:14px 16px; }
  .thumb { width:150px; border-radius:8px; background:#fff; object-fit:contain; align-self:start; }
  .body { min-width:0; }

  .row { display:flex; align-items:baseline; gap:10px; margin-bottom:6px; flex-wrap:wrap; }
  .key { font-size:12px; color:var(--muted); width:66px; flex:none; }
  .val { font-family:ui-monospace,Consolas,monospace; font-size:21px; font-weight:600; letter-spacing:.04em; word-break:break-all; }
  .val.miss { font-size:14px; font-weight:400; color:var(--bad); letter-spacing:0; }

  .proof { margin-top:10px; }
  .proof img { max-width:100%; border-radius:6px; display:block; background:#fff; }
  .proof-cap { font-size:11px; color:var(--muted); margin-top:4px; }

  .meta { display:flex; gap:12px; flex-wrap:wrap; margin-top:12px;
          font-size:12px; color:var(--muted); font-family:ui-monospace,Consolas,monospace; }
  .meta b { color:var(--fg); font-weight:600; }
  .copy { margin-left:auto; font-size:12px; color:var(--muted); background:var(--panel-2);
          border:1px solid var(--line); border-radius:6px; padding:3px 10px; cursor:pointer; }
  .copy:hover { color:var(--fg); border-color:var(--accent); }

  details { margin-top:10px; }
  summary { font-size:12px; color:var(--muted); cursor:pointer; }
  .lines { margin-top:8px; display:flex; flex-direction:column; gap:4px; }
  .line { font-family:ui-monospace,Consolas,monospace; font-size:12px; color:var(--muted);
          display:flex; gap:8px; align-items:center; }
  .line b { color:var(--fg); font-weight:600; }
  .bar { width:70px; height:5px; background:var(--panel-2); border-radius:3px; overflow:hidden; flex:none; }
  .bar > i { display:block; height:100%; }
  .note { font-size:12.5px; color:var(--muted); margin:14px 2px 0; }
  .note code { font-family:ui-monospace,Consolas,monospace; background:var(--panel-2);
               padding:1px 5px; border-radius:4px; color:var(--fg); }
  @media (max-width:600px) { .grid { grid-template-columns:1fr; } .thumb { width:100%; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>택 검수</h1>
    <div id="info">환경 정보 불러오는 중...</div>
  </header>

  <div class="drop" id="drop" tabindex="0" role="button" aria-label="택 사진 업로드">
    <div class="drop-title">택 사진을 여기에 끌어다 놓기</div>
    <div class="drop-sub">클릭해서 선택 &middot; Ctrl+V 로 붙여넣기 &middot; 여러 장 올리면 한 장씩 순서대로 처리</div>
    <input type="file" id="file" accept="image/*" multiple hidden>
  </div>
  <div id="queue"></div>

  <p class="note">
    사진 한 장이 Task 하나다. <b>바코드 값</b>과 <b>인쇄된 시리얼</b>을 각각 읽어 서로 대조한다.
    인쇄면의 <code>*</code>, 공백, 하이픈은 제거하고 비교하며, <code>O</code>/<code>0</code>처럼
    글자 모양이 같아 사람도 못 가리는 쌍은 통합해서 비교한 뒤 그 사실을 판정에 표시한다.
  </p>

  <div id="results"></div>
</main>

<script>
const dropEl = document.getElementById('drop');
const fileEl = document.getElementById('file');
const resultsEl = document.getElementById('results');
const infoEl = document.getElementById('info');
const queueEl = document.getElementById('queue');

fetch('/api/info').then(r => r.json()).then(d => {
  if (d.barcode_only) {
    infoEl.textContent = '바코드 전용 모드 (OCR 비활성)';
    infoEl.className = 'bad';
    return;
  }
  const gpu = d.gpu ? ' (' + d.gpu + ')' : '';
  infoEl.textContent = d.model + ' / ' + d.device + gpu + ' / torch ' + d.env.torch;
  if (d.device !== 'cuda') {
    infoEl.textContent += '  <- GPU 미사용, 느림';
    infoEl.className = 'bad';
  }
}).catch(() => { infoEl.textContent = '환경 정보를 가져오지 못했습니다'; });

// 입력 경로 3가지: 클릭 / 드래그앤드롭 / 붙여넣기
dropEl.addEventListener('click', () => fileEl.click());
dropEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileEl.click(); }
});
fileEl.addEventListener('change', () => { enqueue(fileEl.files); fileEl.value = ''; });
['dragenter', 'dragover'].forEach(ev =>
  dropEl.addEventListener(ev, e => { e.preventDefault(); dropEl.classList.add('over'); }));
['dragleave', 'dragend'].forEach(ev =>
  dropEl.addEventListener(ev, () => dropEl.classList.remove('over')));
dropEl.addEventListener('drop', e => {
  e.preventDefault(); dropEl.classList.remove('over'); enqueue(e.dataTransfer.files);
});
document.addEventListener('paste', e => {
  if (e.clipboardData && e.clipboardData.files.length) enqueue(e.clipboardData.files);
});
// 페이지 밖으로 떨어뜨렸을 때 브라우저가 파일을 여는 것 방지
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

// Task 큐 - 한 번에 하나씩 보내야 표시되는 소요 시간이 실제 1건 처리 시간이 된다
const queue = [];
let running = false;

function enqueue(fileList) {
  const files = [...fileList].filter(f => f.type.startsWith('image/'));
  files.forEach(f => queue.push({ file: f, card: makeCard(f) }));
  drain();
}

async function drain() {
  if (running) return;
  running = true;
  while (queue.length) {
    queueEl.textContent = queue.length > 1
      ? '대기 ' + (queue.length - 1) + '건 · 처리 중...'
      : '처리 중...';
    await run(queue.shift());
  }
  queueEl.textContent = '';
  running = false;
}

async function run(job) {
  const form = new FormData();
  form.append('image', job.file);
  try {
    const res = await fetch('/api/task', { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || (res.status + ' ' + res.statusText));
    fill(job.card, data);
  } catch (err) {
    fill(job.card, { error: err.message });
  }
}

function makeCard(file) {
  const card = document.createElement('div');
  card.className = 'card wait';
  card.innerHTML =
    '<div class="head">' +
      '<span class="fname"></span>' +
      '<span class="badge wait">대기 중</span>' +
    '</div>' +
    '<div class="grid">' +
      '<img class="thumb" alt="">' +
      '<div class="body"></div>' +
    '</div>';
  card.querySelector('.fname').textContent = file.name;
  card.querySelector('.thumb').src = URL.createObjectURL(file);
  resultsEl.prepend(card);
  return card;
}

function fill(card, data) {
  const badge = card.querySelector('.badge');
  const body = card.querySelector('.body');
  card.classList.remove('wait');
  body.innerHTML = '';

  if (data.error) {
    card.classList.add('bad');
    badge.className = 'badge bad';
    badge.textContent = '실패';
    body.innerHTML = '<div class="val miss">' + esc(data.error) + '</div>';
    if (data.ms) body.appendChild(metaRow(data.ms));
    return;
  }

  const reads = data.reads || [];
  const okCount = reads.filter(r => r.ok).length;
  const allOk = reads.length > 0 && okCount === reads.length;
  card.classList.add(allOk ? 'ok' : 'bad');
  badge.className = 'badge ' + (allOk ? 'ok' : (okCount ? 'warn' : 'bad'));
  badge.textContent = reads.length === 0 ? '실패'
    : (reads.length === 1 ? reads[0].label : '택 ' + reads.length + '장 · ' + okCount + ' 일치');

  reads.forEach((r, i) => {
    const block = document.createElement('div');
    if (i > 0) {
      block.style.marginTop = '18px';
      block.style.paddingTop = '14px';
      block.style.borderTop = '1px solid var(--line)';
    }
    block.innerHTML =
      '<div class="row"><span class="key">바코드</span>' +
        '<span class="val">' + esc(r.barcode || '읽기 실패') + '</span></div>' +
      '<div class="row"><span class="key">인쇄면</span>' +
        '<span class="val ' + (r.text ? '' : 'miss') + '">' +
        esc(r.text || '텍스트를 찾지 못함') + '</span></div>';

    if (reads.length > 1) {
      const tag = document.createElement('div');
      tag.className = 'meta';
      tag.innerHTML = '<span>택 ' + (i + 1) + ' · <b>' + esc(r.label) + '</b></span>';
      block.prepend(tag);
    }
    if (r.detail) {
      const d = document.createElement('div');
      d.className = 'meta';
      d.innerHTML = '<span style="color:var(--bad)">' + esc(r.detail) + '</span>';
      block.appendChild(d);
    }
    if (r.crop) {
      const p = document.createElement('div');
      p.className = 'proof';
      p.innerHTML = '<img src="data:image/png;base64,' + r.crop + '" alt="">' +
                    '<div class="proof-cap">OCR이 실제로 읽은 영역</div>';
      block.appendChild(p);
    }

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML =
      '<span><b>' + esc(r.format || '-') + '</b></span>' +
      '<span>' + r.angle.toFixed(1) + '° 보정</span>' +
      '<span>감지 ' + esc(r.stage) + '</span>' +
      '<span>conf <b>' + (r.confidence || 0).toFixed(3) + '</b></span>';
    if (r.barcode) meta.appendChild(copyBtn(r.barcode));
    block.appendChild(meta);

    if (r.lines && r.lines.length) {
      const det = document.createElement('details');
      det.innerHTML = '<summary>OCR한 줄 ' + r.lines.length + '개</summary>';
      const list = document.createElement('div');
      list.className = 'lines';
      r.lines.forEach(l => {
        const c = l.confidence;
        const color = c >= 0.9 ? 'var(--good)' : c >= 0.7 ? 'var(--warn)' : 'var(--bad)';
        const row = document.createElement('div');
        row.className = 'line';
        row.innerHTML =
          '<span class="bar"><i style="width:' + Math.max(2, c * 100).toFixed(0) +
            '%;background:' + color + '"></i></span>' +
          '<b>' + (esc(l.text) || '(빈 문자열)') + '</b>' +
          '<span>' + c.toFixed(3) + ' · ' + l.ms.toFixed(1) + ' ms</span>';
        list.appendChild(row);
      });
      det.appendChild(list);
      block.appendChild(det);
    }
    body.appendChild(block);
  });

  body.appendChild(metaRow(data.ms));
}

function metaRow(ms) {
  const el = document.createElement('div');
  el.className = 'meta';
  el.style.marginTop = '12px';
  el.innerHTML =
    '<span>디코드 ' + ms.decode.toFixed(0) + '</span>' +
    '<span>바코드 ' + ms.barcode.toFixed(0) + '</span>' +
    '<span>OCR ' + ms.ocr.toFixed(0) + '</span>' +
    '<span>합계 <b>' + ms.total.toFixed(0) + ' ms</b></span>';
  return el;
}

function copyBtn(text) {
  const b = document.createElement('button');
  b.className = 'copy';
  b.textContent = '복사';
  b.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(text);
      b.textContent = '복사됨';
      setTimeout(() => { b.textContent = '복사'; }, 1200);
    } catch (e) { b.textContent = '복사 실패'; }
  });
  return b;
}

function escapeMap(ch) {
  if (ch === '&') return '&amp;';
  if (ch === '<') return '&lt;';
  if (ch === '>') return '&gt;';
  if (ch === '"') return '&quot;';
  return '&#39;';
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, escapeMap);
}
</script>
</body>
</html>
